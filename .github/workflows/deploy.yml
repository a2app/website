name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What deploy-pages needs to hand the artifact to Pages and prove where it
# came from. Nothing here can write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A second push queues rather than racing the first,
# so the domain never serves a half-replaced build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The parity test reads dist, so it runs after the build and before the
      # upload: a page that has silently lost legacy copy never reaches the
      # domain. astro check catches type errors the build itself tolerates.
      - run: npm run check
      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
